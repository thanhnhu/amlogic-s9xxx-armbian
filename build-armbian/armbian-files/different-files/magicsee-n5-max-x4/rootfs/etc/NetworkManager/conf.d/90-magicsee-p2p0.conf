# The W1 driver creates a p2p0 interface next to wlan0. If NetworkManager
# manages it, its P2P scans make the driver reject wlan0 scans for a while
# ("rejected scan due to p2p negotiation"), which delays the first scan and
# autoconnect after boot. Leave p2p0 alone.
[keyfile]
unmanaged-devices=interface-name:p2p0
